spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_JDBC_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
  flyway:
    url: ${SUPABASE_FLYWAY_JDBC_URL:${SUPABASE_JDBC_URL}}
    user: ${SUPABASE_FLYWAY_USERNAME:${SUPABASE_DB_USERNAME}}
    password: ${SUPABASE_FLYWAY_PASSWORD:${SUPABASE_DB_PASSWORD}}
    default-schema: gym
    schemas: gym
    connect-retries: ${FLYWAY_CONNECT_RETRIES:3}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:PT5S}
  docker:
    compose:
      enabled: false

coach-gym:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    csrf-cookie:
      same-site: ${CSRF_COOKIE_SAME_SITE:none}
      secure: ${CSRF_COOKIE_SECURE:true}
    headers:
      hsts-enabled: true

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: none

gym:
  storage:
    provider: supabase
    supabase:
      endpoint: ${SUPABASE_STORAGE_URL}
      secret-key: ${SUPABASE_SECRET_KEY}
      bucket: ${SUPABASE_STORAGE_BUCKET:coach-gym-private}
      connection-timeout: ${SUPABASE_STORAGE_CONNECTION_TIMEOUT:PT5S}
      request-timeout: ${SUPABASE_STORAGE_REQUEST_TIMEOUT:PT30S}
