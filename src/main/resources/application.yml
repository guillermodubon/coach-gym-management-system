spring:
  application:
    name: coach-gym-management-system
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:PT30S}
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5433}/${POSTGRES_DB:coach_gym}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:coach_gym_app}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT:3000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME:1800000}
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      file: compose.yaml
      lifecycle-management: start-only
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gym
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:8MB}

gym:
  time-zone: America/El_Salvador
  currency: USD
  storage:
    provider: ${STORAGE_PROVIDER:local}
    access-credentials:
      directory: ${ACCESS_CREDENTIALS_DIRECTORY:data/access-credentials}
    payment-receipts:
      directory: ${PAYMENT_RECEIPTS_DIRECTORY:data/payment-receipts}

coach-gym:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      max-age: ${CORS_MAX_AGE:PT1H}
    session:
      absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:PT8H}
    headers:
      hsts-enabled: ${SECURITY_HSTS_ENABLED:false}
      hsts-max-age: ${SECURITY_HSTS_MAX_AGE:PT8760H}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT1M}
    request:
      max-json-body-bytes: ${MAX_JSON_BODY_BYTES:1048576}
      max-form-body-bytes: ${MAX_FORM_BODY_BYTES:65536}
      max-multipart-body-bytes: ${MAX_MULTIPART_BODY_BYTES:8388608}
  email:
    enabled: ${EMAIL_ENABLED:false}
    provider: ${EMAIL_PROVIDER:smtp}
    organization-name: ${EMAIL_ORGANIZATION_NAME:Coach Gym}
    template-version: ${EMAIL_TEMPLATE_VERSION:v1}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@coach-gym.local}
    from-name: ${EMAIL_FROM_NAME:Coach Gym}
    reply-to: ${EMAIL_REPLY_TO:}
    smtp-host: ${SMTP_HOST:localhost}
    smtp-port: ${SMTP_PORT:1025}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
    smtp-auth-enabled: ${SMTP_AUTH_ENABLED:false}
    smtp-starttls-enabled: ${SMTP_STARTTLS_ENABLED:false}
    connection-timeout: ${SMTP_CONNECTION_TIMEOUT:PT5S}
    read-timeout: ${SMTP_READ_TIMEOUT:PT10S}
    write-timeout: ${SMTP_WRITE_TIMEOUT:PT10S}
    max-message-bytes: ${EMAIL_MAX_MESSAGE_BYTES:12582912}
    max-retry-count: ${EMAIL_MAX_RETRY_COUNT:3}
    stale-pending-threshold: ${EMAIL_STALE_PENDING_THRESHOLD:PT15M}
    resend:
      api-key: ${RESEND_API_KEY:}
      endpoint: ${RESEND_ENDPOINT:https://api.resend.com/emails}
      connection-timeout: ${RESEND_CONNECTION_TIMEOUT:PT5S}
      request-timeout: ${RESEND_REQUEST_TIMEOUT:PT15S}
  payment:
    stripe:
      enabled: ${STRIPE_ENABLED:false}
      sandbox: ${STRIPE_SANDBOX:false}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-signing-secret: ${STRIPE_WEBHOOK_SIGNING_SECRET:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/stripe/success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/stripe/cancel}
      connect-timeout: ${STRIPE_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${STRIPE_READ_TIMEOUT:PT15S}
      webhook-tolerance: ${STRIPE_WEBHOOK_TOLERANCE:PT5M}
      max-webhook-payload-bytes: ${STRIPE_MAX_WEBHOOK_PAYLOAD_BYTES:262144}
      max-signature-header-length: ${STRIPE_MAX_SIGNATURE_HEADER_LENGTH:1024}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,storage,email,stripe
  health:
    db:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    level: "%5p [corr=%X{correlation_id:-}]"

server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  servlet:
    session:
      timeout: ${SESSION_IDLE_TIMEOUT:PT30M}
      cookie:
        http-only: true
        path: /
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:PT30M}
