name: Frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
      - "backend/src/main/**"
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/gradlew"
      - "backend/gradlew.bat"
      - "backend/gradle/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
      - "backend/src/main/**"
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/gradlew"
      - "backend/gradlew.bat"
      - "backend/gradle/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types, lint, format, and unit tests
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke and accessibility checks
        run: npm run test:e2e

  integration:
    name: Real session integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run isolated backend and browser integration
        run: npm run test:e2e:integration
